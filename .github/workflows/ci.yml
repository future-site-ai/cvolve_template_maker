name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cvolve_template_maker
      # The shared template kit lives in the CVolve repository
      - uses: actions/checkout@v4
        with:
          repository: future-site-ai/cvolve
          path: cvolve
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, pdo_sqlite, pdo_pgsql, sodium
          coverage: none
      - working-directory: cvolve_template_maker
        run: composer install --no-interaction --no-progress --prefer-dist
      - working-directory: cvolve_template_maker
        run: |
          php bin/console lint:twig templates
          php bin/console lint:container
          php bin/console doctrine:schema:validate --skip-sync --env=test
          vendor/bin/phpunit
          php bin/console cache:warmup --env=dev
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
